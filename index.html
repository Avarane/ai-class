    const d=(V.fx==="reverse"?V.rev:V.buf).getChannelData(0),step=Math.ceil(d.length/w);ctx.fillStyle=css("--blue");
    for(let x=0;x<w;x++){let mx=0;for(let j=0;j<step;j+=8)mx=Math.max(mx,Math.abs(d[x*step+j]||0));const bh=Math.max(1,mx*h*.95);ctx.fillRect(x,(h-bh)/2,1,bh)}}
  function stopVoice(){V.nodes.forEach(n=>{try{n.stop?n.stop():n.disconnect()}catch(e){}});V.nodes=[];if(window.speechSynthesis)speechSynthesis.cancel()}
  function playVoice(){
    if(V.tts){if(!window.speechSynthesis){$("#vstat").textContent="This browser can't speak text aloud.";return}
      speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($("#ttsText").value||"Hello");const t=TTS[V.fx];u.pitch=Math.min(2,t[0]*V.pitch);u.rate=t[1];
      let words=($("#ttsText").value||"Hello").split(" ");if(V.fx==="reverse")u.text=words.reverse().join(" ");speechSynthesis.speak(u);return}
    if(!V.buf){$("#vstat").textContent="Record something first.";return}
    Player.ensure();const ac=Player.ac,f=FX[V.fx],t=ac.currentTime+.02;
    const src=ac.createBufferSource();src.buffer=f.rev?V.rev:V.buf;src.playbackRate.value=f.r*V.pitch;V.nodes.push(src);let node=src;
    if(f.ring){const g=ac.createGain();g.gain.value=0;const o=ac.createOscillator();o.frequency.value=f.ring;o.connect(g.gain);o.start(t);o.stop(t+src.buffer.duration/src.playbackRate.value+.1);node.connect(g);node=g;V.nodes.push(o)}
    if(f.band){const b=ac.createBiquadFilter();b.type="bandpass";b.frequency.value=f.band;b.Q.value=1.4;const ws=ac.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*3)}ws.curve=c;node.connect(b);b.connect(ws);node=ws}
    if(f.low){const l=ac.createBiquadFilter();l.type="lowpass";l.frequency.value=f.low;node.connect(l);node=l}
    if(f.vib){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f.vib[0];g.gain.value=f.vib[1];o.connect(g).connect(src.detune);o.start(t);o.stop(t+src.buffer.duration/src.playbackRate.value+.1);V.nodes.push(o)}
    const out=ac.createGain();out.gain.value=1.3;node.connect(out);out.connect(Player.master);
    const e=Math.max(V.echo,f.echo||0);if(e>0){const d=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();d.delayTime.value=f.echo?.32:.24;fb.gain.value=e;wet.gain.value=.7;out.connect(d);d.connect(fb).connect(d);d.connect(wet).connect(Player.master);
      setTimeout(()=>{try{d.disconnect();fb.disconnect()}catch(x){}},(src.buffer.duration/src.playbackRate.value+4)*1000)}
    src.start(t);award("voice",20,"Changed your voice")}
  Player.voiceHook=()=>{if($("#vinsong")&&$("#vinsong").checked&&(V.buf||V.tts))playVoice()};
  function noMic(msg){V.tts=true;$("#ttsBox").hidden=false;$("#vstat").textContent=msg;drawWave()}
  $("#rec").onclick=async()=>{
    if(V.rec&&V.rec.state==="recording"){V.rec.stop();return}
    if(!navigator.mediaDevices||!window.MediaRecorder){noMic("Recording isn't supported in this browser, so you can use a computer voice instead.");return}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
    catch(e){noMic("The microphone isn't available here (it may be blocked or not allowed). You can use a computer voice instead, or open this page in a browser where you allow the microphone.");return}
    V.tts=false;$("#ttsBox").hidden=true;Player.ensure();const chunks=[];V.rec=new MediaRecorder(stream);V.rec.ondataavailable=e=>chunks.push(e.data);
    let left=8;$("#rec").textContent="⏹ Stop recording";$("#recT").textContent="Recording… 8s";$("#vstat").textContent="";
    const tm=setInterval(()=>{left--;$("#recT").textContent=`Recording… ${left}s`;if(left<=0&&V.rec.state==="recording")V.rec.stop()},1000);
    V.rec.onstop=async()=>{clearInterval(tm);stream.getTracks().forEach(t=>t.stop());$("#rec").textContent="🎙️ Record again";$("#recT").textContent="";
      try{const ab=await new Blob(chunks).arrayBuffer();V.buf=await Player.ac.decodeAudioData(ab);
        V.rev=Player.ac.createBuffer(V.buf.numberOfChannels,V.buf.length,V.buf.sampleRate);for(let c=0;c<V.buf.numberOfChannels;c++)V.rev.getChannelData(c).set(Array.from(V.buf.getChannelData(c)).reverse());
        $("#vstat").textContent="Got it! Now pick an effect and press play.";drawWave()}
      catch(e){$("#vstat").textContent="That recording couldn't be read. Try again."}};
    V.rec.start()};
  $("#vfx").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("#vfx").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed","true");V.fx=c.dataset.fx;drawWave();stopVoice();playVoice()});
  $("#vpitch").oninput=e=>{V.pitch=+e.target.value;$("#vpitchO").textContent=V.pitch.toFixed(2)+"×"};
  $("#vecho").oninput=e=>{V.echo=+e.target.value;$("#vechoO").textContent=Math.round(V.echo*100)+"%"};
  $("#vplay").onclick=()=>{stopVoice();playVoice()};
  requestAnimationFrame(drawWave);
  Player.load(song);build();
};

   {id:"launch",ic:"🚀",n:()=>"Launch to the public",d:"Release it. Users join based on accuracy and trust.",cost:()=>30000,ap:1,can:()=>!!g.model&&!g.launched,run(){g.launched=true;say(`${g.name} is live! 🎉`,"good");if(est()<70){g.trust-=10;say("It launched before it was ready. Early users were disappointed.","bad")}}},
   {id:"pitch",ic:"🎤",n:()=>"Pitch to investors",d:"Convince Chief Bello to fund you. Once every 3 weeks.",cost:()=>0,ap:1,can:()=>g.week-g.pitchWeek>=3,run(){g.pitchWeek=g.week;pitchModal()}}
  ];
  /* ---------- events ---------- */
  const EVENTS=[
   {id:"sell",when:()=>g.week>=3,em:"💰",t:"An easy offer",x:()=>`A company offers ${naira(250000)} for your users' phone numbers and locations. "Nobody will know," they say.`,
    c:[["Take the money",()=>{g.money+=250000;g.sold=true;return"You took the money. Your bank account is happy… for now."}],["Refuse. Users trusted us.",()=>{g.trust=Math.min(100,g.trust+8);return"Aunty Ada: \"Integrity is your best investment.\" Word spreads that you can be trusted."}]]},
   {id:"scandal",when:()=>g.sold&&g.week>=6,em:"📰",t:"Scandal!",x:()=>"A newspaper reports that your startup sold users' data. People are angry.",c:[["Apologise publicly",()=>{g.trust=Math.max(0,g.trust-30);return"Trust dropped sharply. Selling data broke a promise you can't easily fix."}]]},
   {id:"harm",when:()=>g.m.img,em:"🌫️",t:"Harmattan haze",x:()=>"Dusty harmattan air is making photos blurry, and the AI is confused.",
    c:[[`Collect hazy photos too (${naira(30000)})`,()=>{g.money-=30000;g.data[0]+=60;g.data[1]+=60;return"Smart. Training on hazy photos makes your AI work in all seasons."}],["Ignore it",()=>{g.q=Math.max(.3,g.q-.08);return"Data quality dropped. AI struggles with conditions it never saw in training."}]]},
   {id:"rain",when:()=>!g.m.img,em:"⛈️",t:"Unusual weather",x:()=>"This season is different from the past. Your AI was trained on old patterns.",
    c:[[`Collect fresh data (${naira(30000)})`,()=>{g.money-=30000;g.data[0]+=60;g.data[1]+=60;return"Good call. AI must be updated when the world changes."}],["Keep the old model",()=>{g.q=Math.max(.3,g.q-.08);return"Your AI's predictions got worse. Old data doesn't always describe today."}]]},
   {id:"nepa",when:()=>true,em:"🔌",t:"No light!",x:()=>"Power has been out for days. Your laptops are dying.",
    c:[[`Buy diesel for the generator (${naira(40000)})`,()=>{g.money-=40000;return"The generator hums. Work continues."}],["Wait it out",()=>{g.skipAP=1;return"You'll have one less action next week."}]]},
   {id:"complain",when:()=>g.launched&&g.model&&g.model[1]<70,em:"😟",t:"A complaint",x:()=>`Someone from ${g.m.groups[1].toLowerCase()} says: "Your app keeps getting it wrong for us. It's like it wasn't made for people like me."`,
    c:[["Ignore it, most users are happy",()=>{g.trust=Math.max(0,g.trust-15);return"Ignoring unfairness damages trust. People talk."}],[`Visit and collect data there (${naira(30000)})`,()=>{g.money-=30000;g.data[1]+=150;g.trust=Math.min(100,g.trust+5);return"You listened and collected data from their community. Retrain to include them."}]]},
   {id:"journalist",when:()=>g.launched,em:"🎙️",t:"Radio interview",x:()=>"A radio presenter asks: \"Is your AI perfect? Can people trust it 100%?\"",
    c:[["\"Yes, it's perfect!\"",()=>{g.hype=true;g.users=g.users.map(u=>u+60);return"More people signed up… but when it makes mistakes, they'll feel lied to."}],["\"No AI is perfect. Here's how to use it wisely.\"",()=>{g.trust=Math.min(100,g.trust+8);return"Honesty builds long-term trust. Listeners respected that."}]]},
   {id:"viral",when:()=>g.launched&&est()>=75,em:"📱",t:"You went viral!",x:()=>"A student made a TikTok about your app and it blew up.",c:[["Celebrate 🎉",()=>{g.users=g.users.map(u=>Math.min(1000,u+120));return"Hundreds of new users joined!"}]]},
   {id:"rush",when:()=>g.data[0]+g.data[1]>=200,em:"⏩",t:"A shortcut",x:()=>"Your teammate says: \"Let's skip checking the labels. Nobody will notice a few mistakes.\"",
    c:[["Okay, save time",()=>{g.q=Math.max(.3,g.q-.12);return"Bad labels teach the AI wrong lessons. Quality dropped."}],["No, quality matters",()=>{g.ap=Math.max(0,g.ap-1);return"It cost you time today, but your data stays clean."}]]},
   {id:"competitor",when:()=>g.week>=5,em:"🏢",t:"A big competitor",x:()=>"A large company launches a similar app, but only in English and only for cities.",
    c:[["Focus on everyone they ignore",()=>{if(g.translated){g.users[1]=Math.min(1000,g.users[1]+100);return"Because you support local languages, many people chose you!"}return"You'll need local languages and village data to stand out."}]]},
   {id:"grant",when:()=>g.week>=4,em:"🏆",t:"Innovation grant",x:()=>`A tech hub in Abuja is giving grants of up to ${naira(400000)} to student startups.`,c:[["Pitch for it",()=>{setTimeout(()=>pitchModal(true),50);return"Get ready to pitch!"}],["Skip it",()=>"Maybe next time."]]},
   {id:"leak",when:()=>g.week>=7&&!g.privacy&&g.launched,em:"🚨",t:"Data leak",x:()=>"Hackers found an unprotected database and leaked user information.",c:[["Fix it and inform users",()=>{g.trust=Math.max(0,g.trust-20);g.money-=40000;return"Privacy protection would have prevented this. Always protect users' data."}]]}
  ];
  /* ---------- modal ---------- */
  function modal(html,after){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(m);
    const f=m.querySelector("button,textarea");f&&f.focus();after&&after(m);return m}
  function event(){
    const pool=EVENTS.filter(e=>!g.usedEv.includes(e.id)&&e.when());
    const forced=pool.find(e=>e.id==="scandal"&&Math.random()<.6)||pool.find(e=>e.id==="leak"&&Math.random()<.5);
    const ev=forced||(Math.random()<.75&&pool.filter(e=>!["scandal","leak"].includes(e.id)).length?pickR(pool.filter(e=>!["scandal","leak"].includes(e.id))):null);
    if(!ev){render();return}
    g.usedEv.push(ev.id);
    const m=modal(`<div class="em">${ev.em}</div><h2>${ev.t}</h2><p>${esc(ev.x())}</p><div class="choices">${ev.c.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c[0])}</button>`).join("")}</div><p class="feedback" id="evf"></p>`);
    m.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(m.dataset.d)return;m.dataset.d=1;const r=ev.c[+b.dataset.i][1]();b.classList.add("right");say(`${ev.em} ${ev.t}: ${r}`,/drop|angry|worse|lied|damages|leak/i.test(r)?"bad":"");
      $("#evf").textContent=r;const k=document.createElement("button");k.className="btn primary";k.textContent="Continue";k.style.marginTop="10px";k.onclick=()=>{m.remove();render()};m.querySelector(".card").appendChild(k);k.focus()});
  }
  function pitchModal(grant=false){
    const m=modal(`<div class="em">🎤</div><h2>${grant?"Grant pitch":"Pitch to Chief Bello"}</h2><p>${grant?"The judges want":"Chief Bello is a tough investor. He wants"} to hear: the problem, who you help, how your AI works and why people will trust it. Write 2 to 4 sentences.</p>
      <textarea id="pitchT" placeholder="${esc(g.name)} helps…"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="pitchGo">Deliver pitch</button>${pill()}</div><p class="status" id="pst" aria-live="polite"></p><div id="pres"></div>`);
    lightPills();
    m.querySelector("#pitchGo").onclick=async()=>{const t=m.querySelector("#pitchT").value.trim();if(t.split(/\s+/).length<8){m.querySelector("#pst").textContent="Say a bit more. At least two full sentences.";return}
      m.querySelector("#pitchGo").disabled=true;m.querySelector("#pst").textContent="The judge is thinking…";let r;
      try{if(!AI)throw{code:"unavailable"};
        r=await AI.json(`${SAFE}\n\nYou are Chief Bello, a fair but demanding Nigerian investor judging a secondary school student's startup pitch. Be encouraging and specific.\nStartup: ${g.name}. Problem: ${g.m.problem} Solution: ${g.m.ai}.\nPitch: "${t}"\nScore 1-10 on clarity, who it helps, how the AI works, and trust/fairness. Respond with only JSON: {"score": number, "liked": one sentence, "improve": one sentence}`,{modelTier:"quick",cache:false})}
      catch(e){const w=t.toLowerCase();let s=3;[["help","solve","problem"],["farmer","student","trader","people","communit","village","famil"],["ai","data","learn","predict","model","photo","sms"],["trust","privacy","fair","safe","language","everyone"],["%","week","naira","₦","save","thousand","million"]].forEach(k=>{if(k.some(x=>w.includes(x)))s+=1.4});if(t.split(/\s+/).length>30)s+=.5;
        r={score:Math.min(10,Math.round(s)),liked:"You explained what you're building with energy.",improve:"Say clearly who you help, how the AI learns, and why people can trust it."};if(AI)m.querySelector("#pst").textContent=aiErr(e)}
      const sc=Math.max(1,Math.min(10,+r.score||5)),cash=sc*(grant?40000:30000);g.money+=cash;if(sc>=7)g.trust=Math.min(100,g.trust+3);
      m.querySelector("#pst").textContent="";
      m.querySelector("#pres").innerHTML=`<div class="idea-card"><h3>Score: ${sc}/10</h3><p><b>👍 Liked:</b> ${esc(r.liked)}</p><p><b>💡 Improve:</b> ${esc(r.improve)}</p><p><b>You raised ${naira(cash)}!</b></p><button class="btn primary" id="pcont">Continue</button></div>`;
      say(`🎤 Pitch scored ${sc}/10 and raised ${naira(cash)}.`,"good");award("pitch",20,"First pitch");
      m.querySelector("#pcont").onclick=()=>{m.remove();render()};m.querySelector("#pcont").focus()};
  }
  /* ---------- week cycle ---------- */
  function endWeek(){
    g.money-=15000;
    if(g.launched&&g.model){
      g.model.forEach((a,i)=>{let rate=Math.max(0,(a-55)/40)*(g.trust/100)*.28;if(i===1&&g.translated)rate*=1.35;if(i===0&&g.translated)rate*=1.1;
        g.users[i]=Math.min(1000,g.users[i]+(1000-g.users[i])*rate);if(a<62)g.users[i]*=.88});
      const income=(g.users[0]+g.users[1])*12;g.money+=income;
      if(g.hype&&Math.random()<.4){g.trust=Math.max(0,g.trust-6);say("Users who were told it was 'perfect' are upset by its mistakes.","bad")}
      say(`Week ${g.week}: ${Math.round(g.users[0]+g.users[1])} users. Sponsorship brought in ${naira(income)}.`);
    }
    if(g.money<0){finish("broke");return}
    g.week++;
    if(g.week>12){finish();return}
    g.ap=3-g.skipAP;g.skipAP=0;
    if(g.week===4&&!g.tested)say("Aunty Ada: \"Halfway soon. Have you tested your AI with both communities?\"","tip");
    if(g.week===8&&!g.launched)say("Aunty Ada: \"Time is running out. An AI only helps people once it's launched.\"","tip");
    event();
  }
  function helped(){return g.model?Math.round(g.users[0]*g.model[0]/100+g.users[1]*g.model[1]/100):0}
  /* ---------- render ---------- */
  function people(){const W=380,H=150;let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Community: coloured people use your app">`;
    s+=`<text x="95" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="${css("--muted")}">${esc(g.m.groups[0])}</text><text x="285" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="${css("--muted")}">${esc(g.m.groups[1])}</text><line x1="190" y1="20" x2="190" y2="${H}" stroke="${css("--line")}" stroke-width="2" stroke-dasharray="4 4"/>`;
    [0,1].forEach(gi=>{const n=Math.round(g.users[gi]/1000*20),ok=g.model?Math.round(n*g.model[gi]/100):0;
      for(let k=0;k<20;k++){const x=gi*190+22+(k%5)*36,y=30+Math.floor(k/5)*30;const col=k<ok?css("--green"):k<n?css("--coral"):css("--line");
        s+=`<circle cx="${x}" cy="${y+5}" r="6" fill="${col}"/><rect x="${x-8}" y="${y+12}" width="16" height="12" rx="6" fill="${col}"/>`}});
    return s+"</svg>"}
  function spark(){if(g.versions.length<1)return`<p class="axis">Train your model to see accuracy here.</p>`;const v=g.versions,W=300,H=60,mx=Math.max(2,v.length);
    const pts=v.map((a,i)=>`${10+i*(W-20)/(mx-1)},${H-((a-50)/50)*(H-10)-5}`).join(" ");
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:60px" aria-label="Accuracy across model versions"><polyline points="${pts}" fill="none" stroke="${css("--blue")}" stroke-width="3"/>${v.map((a,i)=>`<circle cx="${10+i*(W-20)/(mx-1)}" cy="${H-((a-50)/50)*(H-10)-5}" r="4" fill="${css("--blue")}"/>`).join("")}</svg>`}
  function play(){render()}
  function render(){if(!root.isConnected||!g||g.done)return;
    const [c,r]=g.data,tot=c+r||1,gap=g.model&&g.tested?Math.abs(Math.round(g.model[0]-g.model[1])):null;
    root.innerHTML=`<div class="hud"><div><small>Week</small><b>${g.week}/12</b></div><div><small>Money</small><b style="color:${g.money<150000?"var(--coral)":"inherit"}">${naira(g.money)}</b></div><div><small>Actions left</small><b>${"⚡".repeat(g.ap)||"none"}</b></div><div><small>Trust</small><b>${Math.round(g.trust)}</b></div><div><small>People helped</small><b>${helped()}</b></div></div>
    <div class="game"><div class="panel"><h3>${g.m.em} ${esc(g.name)}: your AI</h3>
      <div class="kv"><span>Data collected</span><b>${c+r} examples</b></div>
      <div class="stack"><i style="width:${c/tot*100}%;background:var(--blue)"></i><i style="width:${r/tot*100}%;background:var(--sun)"></i></div>
      <div class="legend" style="font-size:.8rem;margin-top:4px"><span><i class="dot" style="background:var(--blue)"></i>${esc(g.m.groups[0])} ${c}</span><span><i class="dot" style="background:var(--sun)"></i>${esc(g.m.groups[1])} ${r}</span></div>
      <div class="kv"><span>Label quality</span><b>${Math.round(g.q*100)}%</b></div><div class="meter"><i style="width:${g.q*100}%;background:${g.q>.75?"var(--green)":"var(--sun)"}"></i></div>
      <div class="kv"><span>Team's accuracy test</span><b>${g.model?est()+"%":"not trained"}</b></div>
      <div class="kv"><span>Accuracy: ${esc(g.m.groups[0])}</span><b>${g.tested?Math.round(g.model[0])+"%":`<span class="hidden-stat">test to find out</span>`}</b></div>
      <div class="kv"><span>Accuracy: ${esc(g.m.groups[1])}</span><b>${g.tested?Math.round(g.model[1])+"%":`<span class="hidden-stat">test to find out</span>`}</b></div>
      ${gap!==null?`<div class="kv"><span>Fairness gap</span><b style="color:${gap>10?"var(--coral)":"var(--green)"}">${gap} points ${gap>10?"⚠️":"✓"}</b></div>`:""}
      <p class="axis" style="margin:10px 0 0">Accuracy over versions</p>${spark()}
      <div class="kv"><span>Status</span><b>${g.launched?"🟢 Live":"🛠️ Building"}${g.translated?" · 🌍":""}${g.privacy?" · 🔒":""}</b></div></div>
    <div class="panel"><h3>The community</h3>${people()}<div class="legend" style="font-size:.8rem"><span><i class="dot" style="background:var(--green)"></i>Helped</span><span><i class="dot" style="background:var(--coral)"></i>Got a wrong answer</span><span><i class="dot" style="background:var(--line)"></i>Not using it yet</span></div>
      <h3 style="margin-top:12px">Diary</h3><div class="log">${g.log.slice(0,14).map(l=>`<p class="${l.cls}">${esc(l.t)}</p>`).join("")}</div></div></div>
    <section class="lab"><span class="lab-tag">Week ${g.week}</span><h2>Choose your moves</h2><p>You have ${g.ap} action${g.ap===1?"":"s"} left this week. Some moves cost money too.</p>
      <div class="actions">${ACTS.map(a=>{const cost=a.cost(),ok=g.ap>=a.ap&&g.money>=cost&&(!a.can||a.can());return`<button class="act" data-id="${a.id}" ${ok?"":"disabled"}><span class="ic">${a.ic}</span><b>${esc(a.n())}</b><small>${a.d}</small><span class="cost">${cost?naira(cost):"Free"} · ${"⚡".repeat(a.ap)}</span></button>`}).join("")}</div>
      <div class="row" style="margin-top:14px"><button class="btn sun" id="endW">${g.week===12?"Finish the game":"End week "+g.week}</button><button class="btn small" id="quitG">Restart</button></div></section>`;
    root.querySelectorAll(".act").forEach(b=>b.onclick=()=>{const a=ACTS.find(x=>x.id===b.dataset.id);g.money-=a.cost();g.ap-=a.ap;a.run();render()});
    $("#endW").onclick=endWeek;$("#quitG").onclick=e=>{const b=e.currentTarget;if(b.dataset.sure){g=null;setup()}else{b.dataset.sure=1;b.textContent="Click again to restart"}};
  }
  /* ---------- ending ---------- */
  function finish(why){g.done=true;
    const h=helped(),gap=g.model?Math.abs(Math.round(g.model[0]-g.model[1])):40,impact=Math.min(100,h/14),fair=Math.max(0,100-gap*3),trust=g.trust;
    const total=why==="broke"?Math.min(35,impact):(impact*.5+fair*.25+trust*.25);const stars=Math.max(1,Math.min(5,Math.round(total/20)));
    let title,story;
    if(why==="broke"){title="Out of money";story="Your startup ran out of money before it could finish. Real founders plan their budget carefully and look for funding early."}
    else if(!g.launched){title="Great lab, no launch";story="You built something, but it never reached the people who needed it. AI only helps once it's in people's hands."}
    else if(gap>12){title="Fast but unfair";story=`Your AI worked well for ${g.m.groups[0].toLowerCase()} but often failed ${g.m.groups[1].toLowerCase()}. That's bias from unbalanced data.`}
    else if(trust<40){title="Clever tech, little trust";story="Your AI was accurate, but people didn't trust your startup. Trust comes from honesty, privacy and listening."}
    else if(stars>=4){title="Community hero";story="Your AI was accurate, fair and trusted. Real people's lives got better because of your choices."}
    else{title="A solid start";story="You helped people and learned a lot. With more diverse data and testing, your AI could help even more."}
    const lessons=[];
    lessons.push(g.data[1]/(g.data[0]+g.data[1]||1)<.35?`Only ${Math.round(g.data[1]/(g.data[0]+g.data[1]||1)*100)}% of your data came from ${g.m.groups[1].toLowerCase()}. Unbalanced data creates unfair AI (lesson 7).`:`You collected data from both communities, which kept your AI fairer.`);
    lessons.push(g.tested?"You tested with real communities, so you could see problems your team's test missed.":"You never tested with both communities, so you never saw how well it worked for each group.");
    lessons.push(g.q>=.8?"High-quality labels helped your AI learn the right patterns.":"Messy labels held your AI back. Good data matters as much as lots of data.");
    if(g.sold)lessons.push("Selling users' data earned quick money but broke their trust.");else lessons.push("You protected users' data, and that kept their trust.");
    if(g.hype)lessons.push("Overhyping AI as 'perfect' backfired. Honest communication works better.");
    store.set("simBest",(()=>{const b=store.get("simBest",null);return !b||stars>b.stars?{stars,name:g.name}:b})());
    award("simdone",40,"Finished the startup game");
    root.innerHTML=`<section class="lab" style="text-align:center"><span class="lab-tag">Week ${Math.min(12,g.week)} report</span><h2>${esc(g.name)}: ${title}</h2>
      <div class="end-stars" aria-label="${stars} out of 5 stars">${"★".repeat(stars)}${"☆".repeat(5-stars)}</div><p style="margin:10px auto">${story}</p>
      <div class="hud" style="position:static;margin:14px 0"><div><small>People helped</small><b>${h}</b></div><div><small>Fairness gap</small><b>${g.model?gap:"–"}</b></div><div><small>Trust</small><b>${Math.round(trust)}</b></div><div><small>Money left</small><b>${naira(Math.max(0,g.money))}</b></div><div><small>Model versions</small><b>${g.versions.length}</b></div></div></section>
      <section class="lab"><h2>What your choices taught you</h2><ul class="report">${lessons.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
      <div class="row"><button class="btn primary" id="again">Play again</button><button class="btn sun" id="saveR">Save report to gallery</button></div></section>`;
    $("#again").onclick=()=>{g=null;setup()};
    $("#saveR").onclick=()=>saveGal({type:"game",title:`${g.name}: ${title} (${stars}★)`,data:`${story}\n\nPeople helped: ${h}\nTrust: ${Math.round(trust)}\n\n${lessons.map(l=>"• "+l).join("\n")}`});
  }
  setup();
};

/* ---------- boot ---------- */
renderXP();home();
</script>
</body>
</html>
